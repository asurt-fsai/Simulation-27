asurt_track_goal_planner:
  ros__parameters:
    use_sim_time: true
    goal_topic: /goal_pose
    map_topic: /map/global_cones
    map_status_topic: /slam/cone_map_status
    odometry_topic: /odom
    planning_period_s: 0.3
    max_odom_age_s: 0.55
    max_map_age_s: 1.5
    max_map_status_age_s: 2.0
    max_detection_pause_s: 3.0
    click_odom_tolerance_s: 0.3
    teleport_distance_m: 8.0
    arrival_radius_m: 0.85
    arrival_heading_rad: 0.55
    max_cones: 1024
    max_gates: 500
    min_probability: 0.22
    # /map/global_cones from asurt_cone_mapper publishes confirmed-only cones;
    # probability here is inverse positional covariance, not existence chance.
    confirmed_map: true
    min_width_m: 2.2
    max_width_m: 7.0
    max_gate_gap_m: 9.0
    max_start_m: 8.0
    max_goal_m: 4.0
    max_goal_distance_m: 1200.0
    min_clearance_m: 0.72
    lateral_fraction: 0.43
    max_heading_change_rad: 0.9
    max_path_curvature_m_inv: 0.18
    resolution_m: 0.4
    max_path_points: 6000
    blue_left: true
