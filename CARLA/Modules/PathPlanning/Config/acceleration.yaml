asurt_acceleration_planner:
  ros__parameters:
    use_sim_time: true
    # Share the exact global map visualized in Planning RViz during testing.
    input_source: map
    global_cones_topic: /map/global_cones
    perception_topic: /perception_landmarks
    odometry_topic: /odom
    max_age_s: 1.5
    teleport_distance_m: 8.0
    planning_period_s: 0.25
    max_cones: 128
    lookahead_m: 22.0
    max_lateral_m: 8.0
    min_probability: 0.25
    min_track_width_m: 2.0
    max_track_width_m: 7.0
    max_pair_along_m: 2.5
    max_pair_gap_m: 10.0
    max_first_pair_m: 8.0
    max_first_lateral_m: 3.0
    max_bend_rad: 1.15
    sample_spacing_m: 0.5
    blue_left: true
    min_forward_gates: 2
    max_heading_error_deg: 18.0
    max_straight_residual_m: 0.8
    max_straight_end_m: 30.0
    prediction_extension_m: 2.0
