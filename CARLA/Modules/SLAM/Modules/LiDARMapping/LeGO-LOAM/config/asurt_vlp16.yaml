# Shared VLP-16, 10 Hz, +/-15 degrees, fully namespace-isolated LOAM outputs.
/**:
  ros__parameters:
    use_sim_time: true
    topics:
      aftMappedToInit: "/slam/lidar/mapped_odom"
    frames:
      cameraInit: "slam_lidar_init"
      camera: "slam_lidar_body"
      laserOdom: "slam_lidar_laser_odom"
      # ImageProjection keeps points in sensor coordinates. Its output must
      # use the existing sensor frame, whose TF is owned by Perception.
      baseLink: "velodyne"
      aftMapped: "slam_lidar_mapped"
      mapAdjusted: "slam_lidar_adjusted_map"
      aftAdjusted: "slam_lidar_adjusted"

image_projection:
  ros__parameters:
    laser:
      num_vertical_scans: 16
      num_horizontal_scans: 1800
      vertical_angle_bottom: -15.0
      vertical_angle_top: 15.0
      sensor_mount_angle: 0.0
      ground_scan_index: 7
    image_projection:
      segment_valid_point_num: 3
      segment_valid_line_num: 2
      segment_theta: 10.0
      lut_resolution: 0.5
      lut_ema_alpha: 0.3
      lut_max_width_change: 0.5
      lut_tolerance_multiplier: 2.0
      lut_max_track_half_width: 4.0
      lut_max_cone_lateral: 5.0
      lut_filter_margin: 0.5
      lut_filter_z_margin_before: 1.0
      lut_filter_z_margin_after: 1.0
      lut_max_cone_distance: 30.0
    topics:
      lidarPoints: "/velodyne_points"
      fullCloudProjected: "/slam/lidar/full_cloud_projected"
      fullCloudInfo: "/slam/lidar/full_cloud_info"
      groundCloud: "/slam/lidar/ground_cloud"
      segmentedCloud: "/slam/lidar/segmented_cloud"
      segmentedCloudPure: "/slam/lidar/segmented_cloud_pure"
      segmentedCloudInfo: "/slam/lidar/segmented_cloud_info"
      outlierCloud: "/slam/lidar/outlier_cloud"
      ConeCloud: "/slam/lidar/cone_cloud"

feature_association:
  ros__parameters:
    laser:
      num_vertical_scans: 16
      num_horizontal_scans: 1800
      scan_period: 0.1
    mapping:
      mapping_frequency_divider: 10
    featureAssociation:
      edge_threshold: 0.1
      surf_threshold: 0.1
      nearest_feature_search_distance: 5.0
    topics:
      laserCloudSharp: "/slam/lidar/laser_cloud_sharp"
      laserCloudLessSharp: "/slam/lidar/laser_cloud_less_sharp"
      laserCloudFlat: "/slam/lidar/laser_cloud_flat"
      laserCloudLessFlat: "/slam/lidar/laser_cloud_less_flat"
      laserCloudCornerLast: "/slam/lidar/laser_cloud_corner_last"
      laserCloudSurfLast: "/slam/lidar/laser_cloud_surf_last"
      outlierCloudLast: "/slam/lidar/outlier_cloud_last"
      laserOdometry: "/slam/lidar/odom_raw"

map_optimization:
  ros__parameters:
    mapping:
      enable_loop_closure: true
      surrounding_keyframe_search_radius: 50.0
      surrounding_keyframe_search_num: 50
      history_keyframe_search_radius: 3.0
      history_keyframe_search_num: 25
      history_keyframe_fitness_score: 0.3
      global_map_visualization_search_radius: 100.0
      cone_voxel_size: 0.8
      cone_match_distance: 1.0
    topics:
      keyPoseOrigin: "/slam/lidar/key_poses"
      laserCloudSurround: "/slam/lidar/local_map"
      historyCloud: "/slam/lidar/history_cloud"
      correctedCloud: "/slam/lidar/corrected_cloud"
      recentCloud: "/slam/lidar/recent_cloud"
      aftMappedAdjusted: "/slam/lidar/mapped_adjusted"
      loopClosureFlag: "/slam/lidar/loop_closure"
      lapCounter: "/slam/lidar/laps"
      coneMap: "/slam/lidar/cone_map"

transform_fusion:
  ros__parameters:
    topics:
      laserOdomToInit: "/slam/lidar/odom_raw"
      integratedToInit: "/slam/lidar/odom"
