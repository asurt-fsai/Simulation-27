asurt_pure_pursuit_control:
  ros__parameters:
    use_sim_time: true
    path_topic: /planning/goal_pose/path
    odometry_topic: /odom
    autonomous_mode_topic: /sim/feedback/autonomous_mode
    drive_topic: /drive
    output_enabled: true
    update_period_s: 0.1
    max_path_age_s: 1.25
    max_odom_age_s: 0.4
    max_mode_age_s: 1.0
    source_odom_tolerance_s: 0.18
    teleport_distance_m: 8.0
    wheelbase_m: 1.575
    lookahead_base_m: 1.8
    lookahead_gain_s: 0.55
    lookahead_min_m: 1.3
    lookahead_max_m: 4.0
    max_steer_rad: 0.45
    target_speed_mps: 0.8
    min_speed_mps: 0.35
    curvature_speed_gain_m: 1.6
    max_accel_mps2: 0.8
